version: "3.8"

services:
  surrealdb:
    image: surrealdb/surrealdb:v2.2.0
    container_name: skulme-surrealdb
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: start --log info --user root --pass rootpassword file:/data/skulme.db
    volumes:
      - surreal_data:/data
    environment:
      - SURREAL_CAPS_ALLOW_ALL=true
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: skulme-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # Client port
      - "8222:8222"   # Management / monitoring port
    command: -js -m 8222 --store_dir /data/jetstream
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 5

  skulme-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skulme-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SURREALDB_URL=ws://surrealdb:8000
      - NATS_URL=nats://nats:4222
      - RUST_LOG=info
    depends_on:
      surrealdb:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  surreal_data:
    driver: local
  nats_data:
    driver: local
