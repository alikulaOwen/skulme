[workspace]
members = [
    "crates/skulme-core",
    "crates/skulme-db",
    "crates/skulme-ingestion",
    "crates/skulme-sandbox",
    "crates/skulme-socratic",
    "crates/skulme-api",
    "crates/skulme-web",
    "problems",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["alikulaOwen"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alikulaOwen/skulme"

[workspace.dependencies]
# Internal workspace crates
skulme-core = { path = "crates/skulme-core" }
skulme-db = { path = "crates/skulme-db" }
skulme-ingestion = { path = "crates/skulme-ingestion" }
skulme-sandbox = { path = "crates/skulme-sandbox" }
skulme-socratic = { path = "crates/skulme-socratic" }

# Async & Runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Serialization & Cryptography
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
rand = "0.8"

# Logging & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

# Messaging & Networking
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
async-nats = "0.38"

# Database
surrealdb = { version = "2.1", features = ["kv-mem", "protocol-ws", "protocol-http"] }
